name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Separate from the stuck official "pages" group so this deploy is not queued behind it.
concurrency:
  group: pages-static-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify learning data and browser flows
        run: node tools/verify-learning-contracts.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Collect static site
        run: |
          mkdir -p _site
          tar --exclude .git --exclude _site --exclude .github --exclude legacy-root -cf - . | tar -C _site -xf -

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Confirm artifact is visible to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 8); do
            if curl --silent --show-error --fail --max-time 10 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME" |
              jq -e --arg name "$PAGES_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1' >/dev/null; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::The Pages artifact has not appeared in the workflow run."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
