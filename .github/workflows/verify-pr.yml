name: Verify learning contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: learning-contracts-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify learning data and browser flows
        run: node tools/verify-learning-contracts.js
