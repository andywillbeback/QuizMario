<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Vocab Spotlight · 登录</title>
<style>
  :root {
    --gold: #e6c98a;
    --text: #f4f7ff;
    --muted: rgba(226, 234, 248, 0.72);
    --line: rgba(255, 255, 255, 0.16);
    --danger: #ffb4c0;
    --ok: #b7f7d2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(88, 126, 196, 0.16), transparent 46%),
      #05070d;
  }
  #photon-spiral {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 32%, transparent 0%, transparent 28%, rgba(2, 4, 10, 0.28) 62%, rgba(2, 4, 10, 0.72) 100%);
  }
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    justify-content: safe center;
    padding: 28px 16px 96px;
  }
  .brand { text-align: center; margin: 0 0 22px; }
  .brand h1 {
    margin: 0;
    font-weight: 560;
    font-size: clamp(2.15rem, 6vw, 3.35rem);
    letter-spacing: 0.045em;
    line-height: 1.05;
    color: #f7fbff;
    text-shadow: 0 0 28px rgba(190, 214, 255, 0.45), 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .subtitle {
    margin: 10px 0 0;
    color: rgba(214, 226, 246, 0.78);
    font-size: 0.92rem;
    letter-spacing: 0.28em;
    font-weight: 500;
  }
  .card {
    width: min(420px, 100%);
    padding: 18px 18px 16px;
    border-radius: 22px;
    background: rgba(9, 14, 28, 0.46);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(18px) saturate(1.25);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
  }
  .lead {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.5;
    text-align: center;
  }
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    margin-bottom: 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .tabs button {
    appearance: none;
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    padding: 9px 12px;
    background: transparent;
    color: rgba(244, 247, 255, 0.66);
    font: inherit;
    font-weight: 650;
    letter-spacing: 0.08em;
  }
  .tabs button[aria-pressed="true"] {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
  }
  label {
    display: block;
    margin: 12px 0 6px;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: rgba(226, 234, 248, 0.8);
  }
  input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: #fff;
    padding: 12px 13px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(3, 6, 14, 0.42);
  }
  input:focus {
    outline: none;
    border-color: rgba(190, 214, 255, 0.9);
    box-shadow: 0 0 0 3px rgba(150, 186, 255, 0.18);
  }
  .actions { margin-top: 16px; }
  button.primary, a.primary {
    appearance: none;
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    font: inherit;
    font-weight: 700;
    color: #121722;
    background: linear-gradient(180deg, #f8fbff, #d5e3f6);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
  }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  button.texty {
    appearance: none;
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border: 0;
    background: transparent;
    color: rgba(214, 226, 246, 0.78);
    font: inherit;
    font-size: 0.86rem;
    cursor: pointer;
  }
  button.texty:disabled { opacity: 0.55; cursor: not-allowed; }
  #auth-msg {
    min-height: 1.35em;
    margin: 12px 0 0;
    font-size: 0.86rem;
    line-height: 1.45;
    text-align: center;
  }
  #auth-msg.ok { color: var(--ok); }
  #auth-msg.bad { color: var(--danger); }
  #config-banner {
    margin: 0 0 12px;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 0.8rem;
    line-height: 1.45;
    color: #f3e2b4;
    background: rgba(230, 201, 138, 0.1);
    border: 1px dashed rgba(230, 201, 138, 0.45);
  }
  .back {
    margin-top: 16px;
    color: rgba(214, 226, 246, 0.8);
    font-size: 0.9rem;
    text-decoration: none;
  }
  .back:hover { color: #fff; }
  #session-panel h2 {
    margin: 4px 0 8px;
    font-size: 1.15rem;
    font-weight: 600;
    text-align: center;
  }
  #session-panel p { margin: 0 0 12px; text-align: center; color: var(--muted); }
  #password-form { margin-top: 8px; }
  .gold-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 3;
    margin: 0;
    text-align: center;
    color: var(--gold);
    font-family: Palatino, "Palatino Linotype", "Iowan Old Style", "Songti SC", "STSong", Georgia, serif;
    font-size: 0.98rem;
    letter-spacing: 0.045em;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid #f7fbff;
    outline-offset: 2px;
  }
  @media (max-width: 420px) {
    .subtitle { letter-spacing: 0.16em; font-size: 0.82rem; }
    .gold-footer { font-size: 0.86rem; letter-spacing: 0.02em; }
  }
</style>
</head>
<body>
<canvas id="photon-spiral" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<main class="stage">
  <header class="brand">
    <h1>Vocab Spotlight</h1>
    <p class="subtitle">Cambridge Examiner</p>
  </header>
  <section class="card" aria-label="账号">
    <p id="config-banner" hidden></p>
    <form id="auth-form">
      <div class="tabs" role="tablist" aria-label="登录或注册">
        <button type="button" id="mode-login" role="tab" aria-pressed="true" aria-selected="true">登录</button>
        <button type="button" id="mode-register" role="tab" aria-pressed="false" aria-selected="false">注册</button>
      </div>
      <p class="lead">用邮箱在手机和电脑上恢复同一份进度。不登录也可以直接玩游戏。</p>
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required placeholder="you@example.com">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="至少 6 位">
      <div id="confirm-label" hidden>
        <label for="confirm">确认密码</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" placeholder="再输入一次">
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="btn-submit">登录</button>
        <button type="button" class="texty" id="btn-forgot">忘记密码</button>
      </div>
    </form>

    <section id="session-panel" hidden>
      <h2>已登录</h2>
      <p>当前账号：<b id="session-email"></b></p>
      <a class="primary" href="index.html">进入游戏</a>
      <button type="button" class="texty" id="btn-session-logout">退出登录</button>
      <form id="password-form">
        <label for="new-password">设置新密码</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 位">
        <label for="new-password-2">再输入一次</label>
        <input id="new-password-2" type="password" autocomplete="new-password" minlength="6">
        <div class="actions">
          <button type="submit" class="primary" id="btn-update-password">更新密码</button>
        </div>
      </form>
    </section>
    <p id="auth-msg" role="status"></p>
  </section>
  <a class="back" href="index.html">← 返回游戏（不登录）</a>
</main>
<p class="gold-footer">Doctoral product powered by Pu Jin</p>
<script src="spiral-field.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="sync-merge.js"></script>
<script src="cloud-client.js"></script>
<script src="auth-page.js"></script>
</body>
</html>
