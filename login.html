<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="application-name" content="聚光单词">
<title>聚光单词 · 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&text=%E8%81%9A%E5%85%89%E5%8D%95%E8%AF%8D&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e6c98a;
    --text: #f4f7ff;
    --muted: rgba(226, 234, 248, 0.72);
    --line: rgba(255, 255, 255, 0.16);
    --danger: #ffb4c0;
    --ok: #b7f7d2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    background: #03060f;
  }
  #photon-spiral {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 36%, transparent 0%, transparent 34%, rgba(2, 5, 14, 0.22) 60%, rgba(1, 3, 10, 0.78) 100%);
  }
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    justify-content: safe center;
    padding: 28px 16px 96px;
  }
  .brand {
    position: relative;
    isolation: isolate;
    text-align: center;
    margin: 0 0 22px;
  }
  .brand::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -140px;
    width: min(520px, 100vw);
    height: 330px;
    transform: translateX(-50%);
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 50% 60% at 50% 72%, rgba(255, 236, 170, 0.30), rgba(255, 214, 120, 0.10) 45%, transparent 72%),
      conic-gradient(from 168deg at 50% 0%, transparent 0deg, rgba(255, 240, 200, 0.16) 12deg, transparent 24deg);
    filter: blur(6px);
    animation: spotPulse 4.5s ease-in-out infinite;
  }
  @keyframes spotPulse {
    0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
  }
  .brand h1 {
    margin: 0;
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
    font-weight: 900;
    font-size: clamp(54px, 6.6vw, 80px);
    letter-spacing: 0.08em;
    line-height: 1.15;
    background: linear-gradient(100deg, #fff4d6 0%, #ffffff 35%, #fff 42%, #ffe08a 48%, #ffffff 54%, #fff 60%, #fff4d6 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: sheen 3.6s ease-in-out infinite, glow 4.5s ease-in-out infinite;
  }
  @keyframes sheen {
    0% { background-position: 120% 0; }
    60%, 100% { background-position: -120% 0; }
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 226, 140, 0.45)) drop-shadow(0 0 22px rgba(255, 200, 90, 0.28)); }
    50% { filter: drop-shadow(0 0 14px rgba(255, 230, 150, 0.75)) drop-shadow(0 0 40px rgba(255, 200, 90, 0.45)); }
  }
  .subtitle {
    margin: 12px 0 0;
    font-family: "Montserrat", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.32em;
    padding-left: 0.32em;
    color: #f3e6c4;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8), 0 0 16px rgba(3, 6, 16, 0.7);
  }
  .card {
    width: min(420px, 100%);
    padding: 18px 18px 16px;
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(18, 28, 52, 0.58), rgba(7, 12, 24, 0.46));
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.42),
      inset 0 1px 0 rgba(255, 255, 255, 0.32),
      inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(6px) saturate(1.2);
    -webkit-backdrop-filter: blur(6px) saturate(1.2);
  }
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    margin-bottom: 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .tabs button {
    appearance: none;
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    padding: 9px 12px;
    background: transparent;
    color: rgba(244, 247, 255, 0.66);
    font: inherit;
    font-weight: 650;
    letter-spacing: 0.08em;
  }
  .tabs button[aria-pressed="true"] {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
  }
  label {
    display: block;
    margin: 12px 0 6px;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: rgba(226, 234, 248, 0.8);
  }
  input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: #fff;
    padding: 12px 13px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(3, 6, 14, 0.42);
  }
  input:focus {
    outline: none;
    border-color: rgba(190, 214, 255, 0.9);
    box-shadow: 0 0 0 3px rgba(150, 186, 255, 0.18);
  }
  .actions { margin-top: 16px; }
  button.primary, a.primary {
    appearance: none;
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    font: inherit;
    font-weight: 700;
    color: #121722;
    background: linear-gradient(180deg, #f8fbff, #d5e3f6);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
  }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  button.texty {
    appearance: none;
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border: 0;
    background: transparent;
    color: rgba(214, 226, 246, 0.78);
    font: inherit;
    font-size: 0.86rem;
    cursor: pointer;
  }
  button.texty:disabled { opacity: 0.55; cursor: not-allowed; }
  #auth-msg {
    min-height: 1.35em;
    margin: 12px 0 0;
    font-size: 0.86rem;
    line-height: 1.45;
    text-align: center;
  }
  #auth-msg.ok { color: var(--ok); }
  #auth-msg.bad { color: var(--danger); }
  #config-banner {
    margin: 0 0 12px;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 0.8rem;
    line-height: 1.45;
    color: #f3e2b4;
    background: rgba(230, 201, 138, 0.1);
    border: 1px dashed rgba(230, 201, 138, 0.45);
  }
  #session-panel h2 {
    margin: 4px 0 8px;
    font-size: 1.15rem;
    font-weight: 600;
    text-align: center;
  }
  #session-panel p { margin: 0 0 12px; text-align: center; color: var(--muted); }
  #password-form { margin-top: 8px; }
  .gold-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 3;
    margin: 0;
    text-align: center;
    color: var(--gold);
    font-family: "Montserrat", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    letter-spacing: 0.22em;
    padding-left: 0.22em;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid #f7fbff;
    outline-offset: 2px;
  }
  @media (max-width: 420px) {
    .brand h1 { font-size: 46px; letter-spacing: 0.06em; }
    .subtitle { font-size: 15px; letter-spacing: 0.18em; padding-left: 0.18em; }
    .gold-footer { font-size: 0.68rem; letter-spacing: 0.1em; padding-left: 0.1em; }
  }
</style>
</head>
<body>
<canvas id="photon-spiral" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<main class="stage">
  <header class="brand">
    <h1>聚光单词</h1>
    <p class="subtitle">Vocab Spotlight</p>
  </header>
  <section class="card" aria-label="账号">
    <p id="config-banner" hidden></p>
    <form id="auth-form">
      <div class="tabs" role="tablist" aria-label="登录或注册">
        <button type="button" id="mode-login" role="tab" aria-pressed="true" aria-selected="true">登录</button>
        <button type="button" id="mode-register" role="tab" aria-pressed="false" aria-selected="false">注册</button>
      </div>
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required placeholder="you@example.com">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="至少 6 位">
      <div id="confirm-label" hidden>
        <label for="confirm">确认密码</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" placeholder="再输入一次">
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="btn-submit">登录</button>
        <button type="button" class="texty" id="btn-forgot">忘记密码</button>
      </div>
    </form>

    <section id="session-panel" hidden>
      <h2>已登录</h2>
      <p>当前账号：<b id="session-email"></b></p>
      <a class="primary" href="index.html">进入游戏</a>
      <button type="button" class="texty" id="btn-session-logout">退出登录</button>
      <form id="password-form">
        <label for="new-password">设置新密码</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 位">
        <label for="new-password-2">再输入一次</label>
        <input id="new-password-2" type="password" autocomplete="new-password" minlength="6">
        <div class="actions">
          <button type="submit" class="primary" id="btn-update-password">更新密码</button>
        </div>
      </form>
    </section>
    <p id="auth-msg" role="status"></p>
  </section>
</main>
<p class="gold-footer">Doctoral product powered by Pu Jin</p>
<script src="meteor.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="sync-merge.js"></script>
<script src="cloud-client.js"></script>
<script src="auth-page.js"></script>
</body>
</html>
